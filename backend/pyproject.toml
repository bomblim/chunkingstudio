[project]
name = "chunking-studio-backend"
version = "0.1.0"
description = "Chunking Studio API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "pdfplumber>=0.11",
    "pymilvus>=2.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
