# Milvus 앞단 nginx 예시 — 엔진(gRPC) TLS 종료
#
# 전제: nginx가 Milvus와 같은 서버에 있고, Milvus .env 가
#   MILVUS_BIND=127.0.0.1  MILVUS_PORT=29530  MILVUS_HEALTH_BIND=127.0.0.1  MILVUS_HEALTH_PORT=9091
# 이 파일을 /etc/nginx/conf.d/milvus.conf 로 복사하고 인증서 경로·호스트명을 바꾼 뒤 `nginx -t && systemctl reload nginx`.
#
# Studio 저장소 설정: URI https://milvus.example.com:19530, 사설 CA면 "CA 인증서 경로"에 CA 파일 지정.

# ---------------------------------------------------------------- 엔진 (gRPC over TLS)
server {
    # nginx 1.25.1 이상은 `listen 19530 ssl;` + `http2 on;` 으로 써도 된다(아래 형식은 경고만 뜨고 동작).
    listen 19530 ssl http2;
    server_name milvus.example.com;

    ssl_certificate     /etc/nginx/tls/milvus.pem;   # 서버 인증서(+ 중간 CA 체인)
    ssl_certificate_key /etc/nginx/tls/milvus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 대량 insert 요청이 막히지 않도록 본문 크기 제한 해제(Milvus 자체 한도가 적용됨)
    client_max_body_size 0;
    # 인덱스 생성·대량 적재처럼 오래 걸리는 호출 대비
    grpc_read_timeout 600s;
    grpc_send_timeout 600s;

    # 접속 허용 대상 (Studio·RAG 런타임 서버). 필요 없으면 지운다.
    # allow 10.0.0.10;
    # deny  all;

    location / {
        grpc_pass grpc://127.0.0.1:29530;
    }
}

# 관리 화면(9091)은 기존 사이트의 server 블록에 nginx-milvus-admin.conf 를 include 해서 /milvus/ 로 연다.
