# ---------------------------------------------------------------- 관리 화면 (WebUI·healthz·metrics) — https://<호스트>/milvus/
# 기존 사이트 server { ... } 블록 안에서 include 한다 (conf.d 에 직접 두지 않는다):
#   cp nginx-milvus-admin.conf /etc/nginx/snippets/milvus-admin.conf
#   server { ... include /etc/nginx/snippets/milvus-admin.conf; }
#
# Milvus WebUI는 화면 경로(/webui)와 API 경로(/api/v1)를 루트 기준으로 고정하고 있어서,
# 경로 접두사(/milvus/) 아래에 두려면 nginx가 응답을 고쳐 줘야 한다.
#   - proxy_redirect      : /webui → /webui/ 리다이렉트(307)의 Location에 /milvus 를 붙임
#   - absolute_redirect   : 리다이렉트를 상대 경로로 보내 외부 포트·스킴이 바뀌지 않게 함
#   - sub_filter          : 화면 basename(window.basename)과 API 주소("/api/v1")를 /milvus 아래로 바꿈
#                           (응답을 고치려면 압축을 끄고 받아야 하므로 Accept-Encoding을 비움)
#   - error_page 404      : Milvus는 /webui/collections 같은 하위 화면을 새로고침하면 404를 내므로 첫 화면으로 돌림
# Milvus 버전을 올리면 WebUI 코드가 바뀔 수 있으니 접속해서 다시 확인한다. (v3.0.6에서 확인)
#
# 9091은 자체 인증이 없다. htpasswd -c /etc/nginx/.htpasswd-milvus admin

location = /milvus { absolute_redirect off; return 301 /milvus/webui/; }

# healthz, metrics, /api/v1/... (WebUI가 호출하는 API)
location /milvus/ {
    auth_basic           "Milvus Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-milvus;

    absolute_redirect off;
    proxy_pass http://127.0.0.1:9091/;
    proxy_redirect / /milvus/;
}

# WebUI 화면
location /milvus/webui/ {
    auth_basic           "Milvus Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-milvus;

    absolute_redirect off;
    proxy_pass http://127.0.0.1:9091/webui/;
    proxy_redirect / /milvus/;

    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once  off;
    sub_filter '<head>'     '<head><script>window.basename="/milvus/webui"</script>';
    sub_filter '"/api/v1"'  '"/milvus/api/v1"';

    proxy_intercept_errors on;
    error_page 404 = /milvus/webui/;
}
# 접속: https://<호스트>/milvus/  (→ /milvus/webui/)
